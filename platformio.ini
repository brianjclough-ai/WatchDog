; WatchDog v1 — ESP32 CYD (2432S028R, ILI9341 320x240)
; Always-on airwave watchdog: passive WiFi/BLE scanning, known-device
; baseline, popup alerts. See README.md.
;
; Display config: include/cyd_ili9341_user_setup.h is -include'd below
; (the exact working config from the SquachWatch donor project for this
; board). USER_SETUP_LOADED=1 stops TFT_eSPI from pulling its default.

[platformio]
default_envs = cyd-ili9341

[env]
platform = espressif32@6.5.0
board    = esp32dev
framework= arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; XPT2046_Touchscreen: PIO registry version is stuck at 0.0.0-alpha
    ; (2019); pull current master from GitHub (donor-confirmed pattern).
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@^2.5.1
    bblanchon/ArduinoJson@^7.0.4
build_unflags =
    ; Some TFT_eSPI configs define conflicting defaults — clear them
    ; (same guard the donor project uses).
    -DILI9341_DRIVER
    -DST7789_DRIVER
    -DST7796_DRIVER

[env:cyd-ili9341]
build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_ili9341_user_setup.h
    ; NimBLE: observer role only (we never connect), trimmed for heap.
    ; Same trim flags as the donor project (documents heap-fragmentation
    ; crashes with full NimBLE on this board).
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
